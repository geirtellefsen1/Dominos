services:
  postgres:
    image: postgres:16-alpine
    container_name: dominion-postgres
    environment:
      POSTGRES_DB: dominion
      POSTGRES_USER: dominion
      POSTGRES_PASSWORD: dominion_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominion"]
      interval: 2s
      timeout: 2s
      retries: 15

  openfga:
    image: openfga/openfga:latest
    container_name: dominion-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "8080:8080"   # HTTP API
      - "8081:8081"   # gRPC API
      - "3001:3000"   # Playground (host 3001 so the gateway can keep 3000)
    healthcheck:
      test: ["CMD", "/openfga", "version"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:

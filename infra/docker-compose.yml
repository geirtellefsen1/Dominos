services:
  postgres:
    image: postgres:16-alpine
    container_name: dominion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dominion}
      POSTGRES_USER: ${POSTGRES_USER:-dominion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dominion_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dominion} -d ${POSTGRES_DB:-dominion}"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: dominion-mock-oidc
    environment:
      LOG_LEVEL: INFO
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    profiles: ["dev"]

  openfga:
    image: openfga/openfga:v1.9.5
    container_name: dominion-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3001:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  gateway:
    build:
      context: ../packages/api-gateway
      dockerfile: Dockerfile
    container_name: dominion-gateway
    environment:
      DOMINION_GATEWAY_ADDR: ${DOMINION_GATEWAY_ADDR:-:3000}
      DOMINION_DATABASE_URL: postgres://${POSTGRES_USER:-dominion}:${POSTGRES_PASSWORD:-dominion_dev}@postgres:5432/${POSTGRES_DB:-dominion}?sslmode=disable
      DOMINION_SESSION_SECRET: ${DOMINION_SESSION_SECRET}
      DOMINION_OIDC_ISSUER: ${DOMINION_OIDC_ISSUER:-}
      DOMINION_OIDC_CLIENT_ID: ${DOMINION_OIDC_CLIENT_ID:-}
      DOMINION_OIDC_CLIENT_SECRET: ${DOMINION_OIDC_CLIENT_SECRET:-}
      DOMINION_OIDC_REDIRECT_URL: ${DOMINION_OIDC_REDIRECT_URL:-http://localhost:3000/auth/callback}
      DOMINION_SCIM_TOKEN: ${DOMINION_SCIM_TOKEN:-}
      DOMINION_FGA_API_URL: ${DOMINION_FGA_API_URL:-http://openfga:8080}
      DOMINION_FGA_STORE_NAME: ${DOMINION_FGA_STORE_NAME:-dominion}
      DOMINION_ADMIN_TOKEN: ${DOMINION_ADMIN_TOKEN:-}
      DOMINION_AUDIT_PRIVATE_KEY: ${DOMINION_AUDIT_PRIVATE_KEY:-}
      DOMINION_DEV_PRINCIPAL_HEADER: ${DOMINION_DEV_PRINCIPAL_HEADER:-false}
      DOMINION_TLS_ENABLED: ${DOMINION_TLS_ENABLED:-true}
      DOMINION_TLS_HOSTNAMES: ${DOMINION_TLS_HOSTNAMES:-}
      DOMINION_TLS_IPS: ${DOMINION_TLS_IPS:-}
      DOMINION_CA_CERT_PEM: ${DOMINION_CA_CERT_PEM:-}
      DOMINION_CA_KEY_PEM: ${DOMINION_CA_KEY_PEM:-}
      DOMINION_ENCRYPTION_KEY: ${DOMINION_ENCRYPTION_KEY:-}
      DOMINION_GRAPH_CLIENT_ID: ${DOMINION_GRAPH_CLIENT_ID:-}
      DOMINION_GRAPH_CLIENT_SECRET: ${DOMINION_GRAPH_CLIENT_SECRET:-}
      DOMINION_GRAPH_TENANT_ID: ${DOMINION_GRAPH_TENANT_ID:-common}
      DOMINION_GRAPH_REDIRECT_URL: ${DOMINION_GRAPH_REDIRECT_URL:-http://localhost:3000/connectors/graph/callback}
      DOMINION_DEV_GRAPH_SIMULATE: ${DOMINION_DEV_GRAPH_SIMULATE:-false}
      DOMINION_ANTHROPIC_API_KEY: ${DOMINION_ANTHROPIC_API_KEY:-}
      DOMINION_ANTHROPIC_MODEL: ${DOMINION_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      DOMINION_TRIAGE_INTERVAL: ${DOMINION_TRIAGE_INTERVAL:-5m}
      DOMINION_TRIAGE_LOOKBACK: ${DOMINION_TRIAGE_LOOKBACK:-1h}
      DOMINION_DEV_SIMULATE_SEND: ${DOMINION_DEV_SIMULATE_SEND:-}
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3443:3443"
    restart: unless-stopped

volumes:
  postgres-data:
